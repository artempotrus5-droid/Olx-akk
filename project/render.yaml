services:
  - type: web
    name: olx-accounts-bot
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DB_PATH
        value: /app/data/accounts.db
    disk:
      name: bot-data
      mountPath: /app/data
      sizeGB: 1
